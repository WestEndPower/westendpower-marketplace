<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dealer Portal | West End Power Equipment</title>
<style>
:root{font:16px/1.5 Arial,Helvetica,sans-serif;color:#202428;background:#176a14}*{box-sizing:border-box}body{margin:0}.portal-wrap{max-width:1180px;margin:0 auto;padding:24px 18px}.portal-header{display:flex;align-items:center;gap:32px;padding:22px 26px;border:1px solid #ffffff35;border-radius:12px;background:#d0d6d9}.portal-logo{display:block;width:210px;max-width:42vw;height:auto;max-height:75px;object-fit:contain}.portal-header h1{margin:0;color:#176a14;font-size:32px;line-height:1.2;font-weight:900}.portal-content{margin-top:22px;padding:26px;border:1px solid #d5dbd4;border-top:5px solid #c8102e;border-radius:12px;background:#fff}.portal-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}.portal-link{display:flex;flex-direction:column;justify-content:center;gap:7px;min-height:116px;padding:22px 24px;border:2px solid #287a32;border-radius:8px;background:#f1f7ef;color:#174f22;text-decoration:none}.portal-link strong{font-size:24px;line-height:1.25}.portal-link span{font-size:15px;color:#425447}.portal-link:hover{background:#e3efdf;border-color:#175921}.portal-link:focus-visible,.portal-header a:focus-visible{outline:3px solid #c8102e;outline-offset:4px}.portal-note{margin:18px 0 0;color:#5a655d;font-size:13px}@media(max-width:560px){.portal-wrap{padding:14px 10px}.portal-header{gap:18px;padding:18px 14px}.portal-logo{width:145px;max-width:40vw}.portal-header h1{font-size:25px}.portal-content{padding:18px 14px;margin-top:16px}.portal-link{padding:20px 16px}.portal-link strong{font-size:21px}}
</style>
</head>
<body>
<main class="portal-wrap">
 <header class="portal-header">
  <a href="marketplace.html" aria-label="West End Power Equipment marketplace"><img class="portal-logo" src="images/West-End-Logo.png" alt="West End Power Equipment"></a>
  <h1>Dealer Portal</h1>
 </header>
 <section class="portal-content" aria-label="Dealer tools">
  <nav class="portal-links" aria-label="Dealer Portal links">
   <a class="portal-link" href="https://westendpower-configurator-api.westendpower-nm.workers.dev/quotes?view=quotes" data-portal-section="quotes">
    <strong>Quotes &amp; Sales Orders</strong>
    <span>Open quotes, update orders, and follow up with customers.</span>
   </a>
  </nav>
  <p class="portal-note">Use your dealer sign-in when prompted.</p>
 </section>
</main>
</body>
</html>
