<style>
:root{--red:#c8102e;--dark:#202020;--border:#ddd;--green:#287a32}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Arial,sans-serif;color:#171717;background:#f7f7f7}
a{color:inherit}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;border:1px solid #222;border-radius:8px;padding:10px 14px;background:#fff;font-weight:800}
.hero{display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:24px;padding:22px;border:1px solid var(--border);border-top:6px solid var(--red);border-radius:14px;background:#fff}
.media{height:300px;display:flex;align-items:center;justify-content:center;background:#f4f4f4;border-radius:10px;overflow:hidden}.media img{width:100%;height:100%;object-fit:contain}.placeholder{font-weight:800;color:#666}
.eyebrow{text-transform:uppercase;font-size:12px;font-weight:900;color:#666}.hero h1{margin:4px 0 8px;font-size:28px}.price{font-size:28px;font-weight:900;color:var(--red)}.stock{font-weight:900;color:var(--green)}
.section{margin:26px 0;padding:20px;border:1px solid var(--border);border-radius:14px;background:#fff}.section h2{margin:0 0 14px;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{display:flex;flex-direction:column;border:1px solid #ccc;border-radius:12px;overflow:hidden;background:#fff}.card-media{height:120px;display:flex;align-items:center;justify-content:center;background:#f6f6f6}.card-media img{width:100%;height:100%;object-fit:contain}.card-body{display:flex;flex-direction:column;flex:1;padding:14px}.card h3{margin:0 0 6px;font-size:18px}.card p{margin:4px 0}.card-price{margin-top:auto;font-size:19px;font-weight:900;color:var(--red)}.select-row{display:flex;gap:8px;align-items:center;margin-top:10px}.select-row input{width:22px;height:22px}.qty{width:66px;padding:8px;border:1px solid #bbb;border-radius:7px}
.summary{position:sticky;bottom:10px;z-index:20;display:flex;gap:16px;align-items:center;justify-content:space-between;margin-top:28px;padding:16px 18px;border-radius:12px;background:var(--dark);color:#fff;box-shadow:0 6px 22px rgba(0,0,0,.28)}.summary strong{font-size:24px}.summary button{border:0;border-radius:8px;padding:11px 16px;background:var(--red);color:#fff;font-weight:900;cursor:pointer}
.empty{color:#666}.included{padding:12px;border-left:4px solid var(--red);background:#fff8ef;border-radius:6px}.note{font-size:13px;color:#666}
@media(max-width:800px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.summary{align-items:flex-start;flex-direction:column}.media{height:240px}}
.stock-action{display:inline-block;margin:8px 6px 0 0;padding:5px 8px;font-size:12px;border:1px solid #aaa;border-radius:5px;background:white;cursor:pointer;text-decoration:none}.stock-details{font-size:13px}.stock-details a{display:block;margin:6px 0}.cart-action{background:#fff;color:#222}.card-media img{max-width:180px}.summary small{display:block}.summary-actions{display:flex;gap:8px;flex-wrap:wrap}
#wep-package-includes{display:block;margin-top:4px;font-size:12px;line-height:1.35;color:#56635b}#wep-package-includes[hidden]{display:none}
.card-body .wep-package-included-note{font-size:12px;font-weight:700;color:#287a32;margin:4px 0}.wep-package-included-note[hidden]{display:none}

.wep-toro-programs{margin:12px 0;padding:12px;border:1px solid #9ab09e;border-radius:8px}.wep-toro-programs h3{margin:0 0 8px}.wep-toro-programs p{font-size:14px;margin:8px 0 0}.wep-toro-choice-row{display:flex;flex-wrap:wrap;gap:6px}.wep-toro-choice-row button{background:#fff;color:#1c572c;border:1px solid #789780;border-radius:5px;padding:7px 9px;font:inherit;cursor:pointer}.wep-toro-choice-row button[aria-pressed=true]{background:#226e32;color:#fff;border-color:#226e32}.wep-toro-freight{margin:0;font-size:13px;gap:5px;align-items:baseline;flex-wrap:nowrap;white-space:nowrap}.wep-toro-freight button{border:0;border-radius:0;background:transparent;padding:0;color:#1c572c;text-decoration:underline;font:inherit}.wep-toro-freight button[aria-pressed=true]{border:0;background:transparent;color:#1c572c;font-weight:700;text-decoration:none}.wep-toro-freight button:focus-visible{outline:2px solid #226e32;outline-offset:3px}.wep-toro-confirm{max-width:420px;width:calc(100% - 48px);padding:22px;border:1px solid #789780;border-radius:9px}.wep-toro-confirm::backdrop{background:#0006}.wep-toro-confirm h2{font-size:22px}.wep-toro-confirm input{display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:10px}.wep-toro-confirm form>div{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.wep-toro-confirm button{padding:10px;border:1px solid #789780;border-radius:5px;background:#fff;color:#1c572c}.wep-toro-confirm button[type=submit]{background:#226e32;color:#fff}
</style>
