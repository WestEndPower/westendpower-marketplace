<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equipment | West End Marketplace</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#20272c;font:16px Arial,sans-serif}main{max-width:1440px;margin:auto;padding:20px}header{background:#fff;border:1px solid #d9dee2;border-radius:12px;padding:20px}h1{margin:0 0 8px}.note{color:#53616c;font-size:14px;line-height:1.5}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.filters button,.actions a{border:1px solid #176c34;background:#fff;color:#176c34;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none}.filters button[aria-pressed=true],.actions a.primary{background:#176c34;color:white}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid #d9dee2;border-radius:12px;padding:17px}.card h2{font-size:19px;margin:8px 0}.card-main{display:grid;grid-template-columns:42% minmax(0,1fr);gap:12px;align-items:start}.card-main>div{min-width:0}.card-image{display:block;width:100%;height:170px;object-fit:contain;object-position:center;background:#f6f7f8;border-radius:8px}.card-image-placeholder{display:grid;place-items:center;color:#6c7880;font-size:12px}.specs{max-height:146px;overflow-y:auto;border:1px solid #e0e5e8;border-radius:8px;padding:7px;margin-top:8px;scrollbar-width:thin}.spec-row{display:flex;justify-content:space-between;gap:6px;padding:5px 0;border-bottom:1px solid #edf0f2;font-size:12px}.spec-row:last-child{border:0}.spec-row strong{text-align:right}.scroll-hint{font-size:11px;color:#66737c;margin:4px 0 0}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}.card-image{height:180px}}@media(max-width:350px){.card-main{grid-template-columns:1fr}}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.actions a{font-size:14px}.muted{color:#66737c;font-size:13px}.price{font-size:20px;font-weight:700}.back{color:#176c34;font-weight:700}.count{margin-bottom:15px}.power-heading{grid-column:1/-1;margin:14px 0 0;padding:13px 16px;background:#e5f0e9;border-left:5px solid #176c34;border-radius:8px;font-size:21px;font-weight:800}.power-heading:first-child{margin-top:0}.filter-label{font-weight:700;margin:0 0 8px}.filter-row{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin:18px 0}.filter-group{min-width:0}.power-group{text-align:right}.power-group .filters{justify-content:flex-end}.filter-group .filters{margin:0}@media(max-width:760px){.filter-row{flex-direction:column;gap:16px}.power-group{text-align:left}.power-group .filters{justify-content:flex-start}}@media(max-width:500px){main{padding:10px}}
</style></head><body><main>
<header><a class="back" href="marketplace.html?category=Blowers&brand=STIHL">← Back to Marketplace</a>
<h1 id="page-title">Equipment</h1>
<p class="note">Browse available models, filter by equipment and power type, and open a product to review its configurations. Product information is supplied by the shared Marketplace catalog.</p></header>
<div class="filter-row"><div class="filter-group equipment-group"><p class="filter-label">Equipment Type</p><nav id="equipment-filters" class="filters" aria-label="Equipment type filters"></nav></div><div class="filter-group power-group"><p class="filter-label">Power Type</p><nav id="power-filters" class="filters" aria-label="Power type filters"></nav></div></div>
<p id="count" class="count" role="status">Loading models…</p><section id="grid" class="grid"></section>
</main><script>
(async()=>{
const params=new URLSearchParams(location.search),selectedBrand=(params.get('brand')||'STIHL').trim(),selectedCategory=(params.get('category')||'Blowers').trim();
document.getElementById('page-title').textContent=selectedBrand+' '+selectedCategory;
document.title=selectedBrand+' '+selectedCategory+' | West End Marketplace';
const grid=document.getElementById('grid'),count=document.getElementById('count'),powerNav=document.getElementById('power-filters');let buttons=[];let models=[],filter='all',equipmentFilter='all';const equipmentNav=document.getElementById('equipment-filters');
const clean=v=>String(v??'').trim(),norm=v=>clean(v).toLowerCase();
function renderPowerFilters(){
const eligible=models.filter(m=>equipmentFilter==='all'||m.type===equipmentFilter);
if(filter!=='all'&&!eligible.some(m=>m.power===filter))filter='all';
powerNav.replaceChildren();
const types=[...new Set(eligible.map(m=>m.power).filter(Boolean))].sort((a,b)=>({electric:0,battery:1,gas:2,diesel:3}[a]??9)-({electric:0,battery:1,gas:2,diesel:3}[b]??9)||a.localeCompare(b));
for(const type of ['all',...types]){const b=document.createElement('button');b.type='button';b.dataset.type=type;b.textContent=type==='all'?'All Power Types':type.charAt(0).toUpperCase()+type.slice(1);b.setAttribute('aria-pressed',String(type===filter));b.addEventListener('click',()=>{filter=type;renderEquipmentFilters();renderPowerFilters();render()});powerNav.appendChild(b)}
}
function renderEquipmentFilters(){
const available=[...new Set(models.filter(m=>filter==='all'||m.power===filter).map(m=>m.type).filter(Boolean))];
if(equipmentFilter!=='all'&&!available.includes(equipmentFilter))equipmentFilter='all';
equipmentNav.replaceChildren();
for(const type of ['all',...available]){const b=document.createElement('button');b.type='button';b.textContent=type==='all'?'All Equipment Types':type;b.setAttribute('aria-pressed',String(equipmentFilter===type));b.addEventListener('click',()=>{equipmentFilter=type;renderPowerFilters();renderEquipmentFilters();render()});equipmentNav.appendChild(b)}
}
function render(){
const order={electric:0,battery:1,gas:2,diesel:3};
const shown=models.filter(m=>(filter==='all'||m.power===filter)&&(equipmentFilter==='all'||m.type===equipmentFilter)).sort((a,b)=>filter==='all'?(order[a.power]??9)-(order[b.power]??9)||((a.minPrice??Infinity)-(b.minPrice??Infinity))||a.model.localeCompare(b.model,undefined,{numeric:true}):((a.minPrice??Infinity)-(b.minPrice??Infinity))||a.model.localeCompare(b.model,undefined,{numeric:true}));
count.textContent=shown.length+' models';
grid.replaceChildren();
let previousPower='';
for(const m of shown){
if(m.power!==previousPower){const heading=document.createElement('h2');heading.className='power-heading';heading.textContent=m.power.charAt(0).toUpperCase()+m.power.slice(1)+' '+selectedCategory;grid.appendChild(heading);previousPower=m.power;}
const card=document.createElement('article');card.className='card';
const eyebrow=document.createElement('div');eyebrow.className='muted';eyebrow.textContent=m.type;
const heading=document.createElement('h2');heading.textContent=m.model;
const detail=document.createElement('p');detail.className='muted';detail.textContent=m.rows.length+' catalog configuration'+(m.rows.length===1?'':'s');
const main=document.createElement('div');main.className='card-main';
const imgUrl=m.imageUrl||'';
const photo=imgUrl?document.createElement('img'):document.createElement('div');photo.className=imgUrl?'card-image':'card-image card-image-placeholder';
if(imgUrl){photo.src=imgUrl;photo.alt=m.model+' product';photo.loading='lazy';photo.onerror=()=>{photo.replaceWith(Object.assign(document.createElement('div'),{className:'card-image card-image-placeholder',textContent:'Image unavailable'}));}}else photo.textContent='Image unavailable';
const info=document.createElement('div');info.append(eyebrow,heading,detail);
const specs=document.createElement('div');specs.className='specs';
for(const [label,value] of m.specs){const line=document.createElement('div');line.className='spec-row';const l=document.createElement('span');l.textContent=label;const v=document.createElement('strong');v.textContent=value;line.append(l,v);specs.appendChild(line)}
if(m.specs.length){info.appendChild(specs);if(m.specs.length>5){const hint=document.createElement('p');hint.className='scroll-hint';hint.textContent='Scroll for more specifications ↓';info.appendChild(hint)}}
main.append(photo,info);
const price=document.createElement('div');price.className='price';price.textContent=m.minPrice?'From $'+m.minPrice.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'See pricing';
const actions=document.createElement('div');actions.className='actions';
const a=document.createElement('a');a.className='primary';a.textContent='View Product';a.href='product.html?'+new URLSearchParams({brand:selectedBrand,model:m.model}).toString();a.target='_blank';a.rel='noopener';actions.appendChild(a);
card.append(main,price,actions);grid.appendChild(card);
}
}

try{
const res=await fetch('data/marketplace-catalog.json',{cache:'no-cache'});if(!res.ok)throw Error('Catalog unavailable');
const data=await res.json(),sources=(data.productSources||[]).filter(s=>norm(s.brand)===norm(selectedBrand));if(!sources.length)throw Error('Brand not found in catalog');const groups=new Map();
for(const src of sources){const h=src.headers,ix=n=>h.indexOf(n),imageIx=ix('ImageURL');
for(const row of src.rows){
if(norm(row[ix('Category')])!==norm(selectedCategory))continue;
const sub=clean(row[ix('SubCategory')]),description=norm(row[ix('Description')]);
const model=clean(row[ix('Model')]);if(!model)continue;

const key=norm(selectedBrand)+'|'+norm(model);if(!groups.has(key))groups.set(key,{model,rows:[],power:'',type:'',minPrice:null,specs:[],imageUrl:''});
const g=groups.get(key);g.rows.push(row);
if(!g.imageUrl)g.imageUrl=clean(row[imageIx]);
for(let i=1;i<=10;i++){const label=clean(row[ix('SpecLabel'+i)]),value=clean(row[ix('SpecValue'+i)]);if(label&&value&&!g.specs.some(pair=>pair[0]===label))g.specs.push([label,value]);}
if(sub&&!g.type)g.type=sub;
const power=norm(row[ix('PowerType')]);if(power)g.power=power;
const price=Number(clean(row[ix('MSRP')]).replace(/[$,]/g,''));if(price>0&&(g.minPrice===null||price<g.minPrice))g.minPrice=price;
}
}
models=[...groups.values()];

for(const m of models){if(!m.type)m.type='Other';if(!m.power)m.power='Unspecified';}
renderEquipmentFilters();renderPowerFilters();render();
}catch(e){count.textContent='Unable to load equipment catalog: '+e.message}
})();
</script></body></html>
